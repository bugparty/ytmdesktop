[package]
name = "youtube-music-desktop-app"
version = "2.0.10"
description = "YouTube Music Desktop App"
authors = ["NovusTheory"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable", "tray-icon", "image-ico"] }

[profile.release]
strip = true
